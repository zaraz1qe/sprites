<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convergence — Sprite Repository</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      padding: 2rem;
      max-width: 960px;
      margin: 0 auto;
    }
    h1 { color: #58a6ff; margin-bottom: 0.5rem; }
    h2 { color: #58a6ff; margin-top: 2rem; margin-bottom: 1rem; font-size: 1.2rem; }
    p { line-height: 1.6; margin-bottom: 1rem; color: #8b949e; }
    code {
      background: #161b22;
      padding: 0.2em 0.4em;
      border-radius: 4px;
      font-size: 0.9em;
      color: #f0883e;
    }
    pre {
      background: #161b22;
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 1rem;
    }
    pre code { background: none; padding: 0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }
    .card span { font-size: 0.85rem; color: #c9d1d9; }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Convergence</h1>
  <p>Sprite asset repository for the AI-driven visual novel artifact.</p>

  <h2>Sprite Manifest</h2>
  <p>The artifact loads <a href="sprite-manifest.json"><code>sprite-manifest.json</code></a> at runtime to discover all characters and expressions.</p>

  <h2>URL Pattern</h2>
  <pre><code>sprites/&lt;character&gt;/&lt;expression&gt;.png</code></pre>

  <h2>Characters</h2>
  <div class="grid" id="characters"></div>

  <script>
    fetch('sprite-manifest.json')
      .then(r => r.json())
      .then(data => {
        const grid = document.getElementById('characters');
        for (const [key, char] of Object.entries(data.characters)) {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `<span><strong>${char.displayName}</strong><br><small style="color:#8b949e">${char.franchise}</small><br><small>${char.sprites.length} sprites</small></span>`;
          grid.appendChild(card);
        }
      });
  </script>
</body>
</html>
